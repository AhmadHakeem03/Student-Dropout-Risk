[project]
name = "dropout-risk"
version = "0.1.0"
description = "Dropout-risk classification from a survey on students' use of generative-AI tools"
authors = [
    { email = "ahmadhakeemo03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.162.0",
    "imbalanced-learn>=0.14.2",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
dropout-risk = "dropout_risk.main:main"
dropout-dashboard = "dropout_risk.dashboard.app:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the root-level app.py
filterwarnings = [
    # raised inside imblearn's ValueDifferenceMetric (used by SMOTEN), not our code
    "ignore:`.*distance.*` is deprecated:DeprecationWarning:imblearn",
    # starlette's TestClient nudging towards httpx2; harmless for our tests
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
